name: Update upm branches on release
on:
  push:
    tags: [ 'unity-v*.*.*' ]
jobs:
  build-upm-core:
    uses: ./.github/workflows/build-upm-from-project-folder.yml
    with:
      project-folder: Assets/Lab/Core
      upm-branch: upm
      tag-prefix: upm
  build-upm-eventsystem:
    needs: build-upm-core
    uses: ./.github/workflows/build-upm-from-project-folder.yml
    with:
      project-folder: Assets/Lab/EventSystem
      upm-branch: upm-eventsystem
      tag-prefix: upm-eventsystem
