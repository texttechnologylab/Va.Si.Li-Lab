name: Build Documentation using MkDocs
# Builds the docs (strict, so broken links fail the check) and deploys them to the gh-pages branch,
# on pushes to main and on pull requests.
on:
  push:
    branches: [main]
    paths: ['Documentation/**', '.github/workflows/mkdocs.yml']
  pull_request:
    branches: [main]
    paths: ['Documentation/**', '.github/workflows/mkdocs.yml']
permissions:
  contents: write
jobs:
  build:
    name: Build and Deploy Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the git-revision-date plugin
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-glightbox
      - name: Build
        run: mkdocs build --strict --config-file Documentation/mkdocs.yml
      - name: Deploy
        run: mkdocs gh-deploy --config-file Documentation/mkdocs.yml --remote-branch gh-pages --force
